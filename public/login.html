<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบ — DemeterRich Ops</title>
<link rel="stylesheet" href="css/shared.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>DemeterRich Ops</h1>
    <p class="sub">ระบบภายในทีม — เข้าสู่ระบบด้วยบัญชีที่แอดมินเพิ่มสิทธิ์ให้แล้ว</p>
    <div id="error" class="error-box" hidden></div>
    <form id="login-form">
      <div class="field">
        <label for="email">อีเมล</label>
        <input id="email" type="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn--primary" type="submit" style="width:100%; justify-content:center;">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword } from "./js/app.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "orders.html";
  });

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.hidden = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "orders.html";
    } catch (err) {
      errorBox.textContent = "เข้าสู่ระบบไม่สำเร็จ — เช็กอีเมล/รหัสผ่านอีกครั้ง (" + err.code + ")";
      errorBox.hidden = false;
    }
  });
</script>
</body>
</html>
